[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "danica"
version = "1.0.0"
requires-python = ">=3.11"
# Everything Danica imports that is not in the standard library
dependencies = [
    "httpx",
    "rich",
    "prompt_toolkit",
    "pypdf",
    "sqlite-vec",
    "python-docx",
    "python-pptx",
    "reportlab",
]

[project.scripts]
# Gives you a `danica` command that runs cli.main()
danica = "danica.cli:main"

[tool.setuptools]
# Listed by hand because scripts/ and evals/ sit next to danica/ and are not part of the app
packages = ["danica", "danica.tools"]